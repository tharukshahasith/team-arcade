<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realistic 3D Dice & Coin Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Back to Dashboard -->
  <a href="../../index.html" class="absolute top-6 left-6 text-xs text-slate-400 hover:text-white flex items-center gap-1.5 border border-slate-800 bg-slate-900/80 px-3.5 py-2 rounded-xl transition z-10 shadow-lg">
    ← Back to Arcade
  </a>

  <!-- Main Game Card -->
  <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-lg w-full text-center shadow-2xl shadow-orange-500/10 relative">
    
    <div class="flex items-center justify-center gap-2 mb-2">
      <span class="text-xs font-semibold uppercase tracking-wider text-orange-400 bg-orange-500/10 border border-orange-500/20 px-2.5 py-0.5 rounded-full">
        WebGL 3D Studio
      </span>
    </div>

    <h1 class="text-2xl sm:text-3xl font-black bg-gradient-to-r from-amber-400 via-orange-400 to-yellow-300 bg-clip-text text-transparent mb-1">
      3D Dice & Coin Studio
    </h1>
    <p class="text-xs text-slate-400 mb-4">Drag with mouse/touch to inspect</p>

    <!-- 3D Canvas Viewport (Fixed height to guarantee proper rendering) -->
    <div id="viewport" style="width: 100%; height: 280px; min-height: 280px; position: relative;" class="flex items-center justify-center mb-4 bg-slate-950/60 rounded-2xl border border-slate-800 cursor-grab active:cursor-grabbing overflow-hidden">
      <!-- Three.js Canvas will be placed here -->
    </div>

    <!-- Result Banner -->
    <div id="resultText" class="text-base font-bold text-slate-300 mb-6 h-8 flex items-center justify-center">
      Ready to Roll or Flip!
    </div>

    <!-- Buttons -->
    <div class="flex gap-3">
      <button id="rollDiceBtn" type="button" class="flex-1 bg-gradient-to-r from-orange-600 to-amber-600 hover:brightness-110 active:scale-95 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-orange-600/30">
        🎲 Roll 3D Dice
      </button>
      <button id="flipCoinBtn" type="button" class="flex-1 bg-gradient-to-r from-yellow-500 to-amber-500 hover:brightness-110 active:scale-95 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-amber-500/30">
        🪙 Flip 3D Coin
      </button>
    </div>
  </div>

  <!-- Script loaded after DOM -->
  <script src="./script.js"></script>
</body>
</html>
