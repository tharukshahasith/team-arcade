<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dice Roller & Coin Toss</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Back to Dashboard -->
  <a href="../../index.html" class="absolute top-6 left-6 text-xs text-slate-400 hover:text-white flex items-center gap-1 border border-slate-800 bg-slate-900 px-3 py-1.5 rounded-lg transition">
    ← Back to Arcade
  </a>

  <!-- Card Container -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-sm w-full text-center shadow-xl shadow-orange-500/5">
    <h1 class="text-2xl font-bold bg-gradient-to-r from-orange-400 to-amber-300 bg-clip-text text-transparent mb-1">
      Dice & Coin Toss
    </h1>
    <p class="text-xs text-slate-400 mb-6">Test your luck with physics & random generation</p>

    <!-- Display Area -->
    <div class="h-36 flex items-center justify-center mb-6">
      <div id="displayIcon" class="text-7xl transition-transform duration-200 select-none">
        🎲
      </div>
    </div>

    <!-- Result Text -->
    <div id="resultText" class="text-sm font-semibold text-slate-300 mb-6 h-6">
      Roll or Flip to start!
    </div>

    <!-- Controls -->
    <div class="flex gap-3">
      <button id="rollDiceBtn" class="flex-1 bg-orange-600 hover:bg-orange-500 active:scale-95 text-white font-medium py-2.5 rounded-xl text-sm transition">
        Roll Dice
      </button>
      <button id="flipCoinBtn" class="flex-1 bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-medium py-2.5 rounded-xl text-sm transition">
        Flip Coin
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
